name: Prepare release draft
run-name: Prepare release draft for ${{ inputs.version }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      networks:
        description: 'Networks'
        required: true
        default: 'mainnet testnet stagenet'
      version:
        description: 'Version'
        required: true

jobs:
  prepare-release-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - run: ./.github/workflows/prepare-release-draft.sh
        id: prepare-release-draft
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_NETWORKS: ${{ inputs.networks }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.prepare-release-draft.outputs.subject-path }}
