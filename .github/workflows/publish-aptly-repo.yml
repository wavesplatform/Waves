name: Publish aptly repo

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  create-aptly-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          wget -nv https://github.com/aptly-dev/aptly/releases/download/v1.6.2/aptly_1.6.2_linux_amd64.zip
          unzip aptly_1.6.2_linux_amd64.zip
          chmod +x aptly_1.6.2_linux_amd64/aptly
          echo `pwd`/aptly_1.6.2_linux_amd64 >> $GITHUB_PATH
      - run: |
          ./.github/workflows/create-aptly-repo.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GPG_KEY_ID: ${{ secrets.OSSRH_GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.OSSRH_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_PASSPHRASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /home/runner/.aptly/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: create-aptly-repo
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
