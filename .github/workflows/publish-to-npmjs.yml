# NPM registry supports only one source workflow per package: https://docs.npmjs.com/trusted-publishers#for-github-actions
name: Publish packages to NPMJS
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
      tag:
        description: Package tag
        required: true
        default: snapshot

concurrency:
  group: "npm-packages"
  cancel-in-progress: false

jobs:
  # Builds and tests with read-only permissions: the npm dev dependencies (vitest, webpack, tsc) never run in the job
  # that can mint the npm OIDC token.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: proudust/gh-describe@9b42731dd866e3cd8165a65f94cc58613def3114 # v2.2.2
        id: ghd
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - env:
          DESCRIBE: ${{ steps.ghd.outputs.describe }}
        run: sbt --server "-Dproject.version=$DESCRIBE" --batch ';lang-tests/testFull;repl/testFull;replJS/fullOptJS'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ride-js-bundle/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - working-directory: ride-js-bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ride-js-package
          if-no-files-found: error
          path: |
            ride-js-bundle/package.json
            ride-js-bundle/readme.md
            ride-js-bundle/dist
            ride-js-bundle/scalajs/ride-scalajs.js
            ride-js-bundle/src/index.d.ts

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: NPMJS
      url: ${{ steps.publish.outputs.url }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # 8.0.2
        with:
          name: ride-js-package
          path: ride-js-bundle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version: '24' # Trusted publishing requires npm CLI 11.5.1 or later (Node 24.7+).
      # @waves/ride-js is versioned independently of the node: a release publishes the version in package.json,
      # and skips publishing when that version is already on npm (no bump since the last release).
      # Dispatch inputs go through env and are validated, never expanded into the script.
      - if: github.event_name == 'workflow_dispatch'
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          [[ "$IN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::bad version: $IN_VERSION"; exit 1; }
          [[ "$IN_TAG" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "::error::bad tag: $IN_TAG"; exit 1; }
          echo "VERSION=$IN_VERSION" >> "$GITHUB_ENV"
          echo "TAG=$IN_TAG" >> "$GITHUB_ENV"
      - if: github.event_name == 'release'
        working-directory: ride-js-bundle
        run: |
          echo "VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
          echo "TAG=latest" >> "$GITHUB_ENV"
      - id: publish
        working-directory: ride-js-bundle
        run: |
          echo "url=https://www.npmjs.com/package/@waves/ride-js/v/$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "@waves/ride-js@$VERSION" version 2>/dev/null)" ]; then
            echo "::notice::@waves/ride-js@$VERSION is already published, skipping"
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # Built and tested by the build job; no lifecycle scripts run here.
          npm publish --provenance --access public --tag "$TAG" --ignore-scripts
